<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 7 - To-Do List and Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Task 7: DOM Manipulation</h1>
        <p>To-Do List and Interactive Image Gallery</p>
    </header>

    <main>
        <section class="card">
            <h2>My To-Do List</h2>
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Enter a new task">
                <button id="addButton">Add Task</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <section class="card">
            <h2>Image Gallery</h2>
            <img id="mainImage" class="main-image"
                 src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000"
                 alt="Beautiful landscape">
            <div class="thumbnails">
                <img class="thumbnail" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=300" alt="Mountain landscape">
                <img class="thumbnail" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=300" alt="Sunrise">
                <img class="thumbnail" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=300" alt="Lake and mountains">
                <img class="thumbnail" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300" alt="Forest">
            </div>
        </section>
    </main>

    <footer>Web Development Laboratory | Task 7</footer>
    <script src="script.js"></script>
</body>
</html>
