<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8 - Advanced DOM Applications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Task 8: Advanced DOM Manipulation</h1>
        <p>Advanced To-Do List and Dynamic Chessboard</p>
    </header>

    <main>
        <section class="card">
            <h2>Advanced To-Do List</h2>
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Enter a task">
                <button id="addButton">Add Task</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <section class="card">
            <h2>Dynamic Chessboard</h2>
            <p class="hint">The chessboard is created using JavaScript loops.</p>
            <div id="chessboard" aria-label="Chessboard"></div>
        </section>
    </main>

    <footer>Web Development Laboratory | Task 8</footer>
    <script src="script.js"></script>
</body>
</html>
